# B. enforce 운영 구성의 Render Blueprint 예시 (이 저장소의 기본 render.yaml이 아님).
# 사용하려면 이 내용을 render.yaml로 옮기기 전에 docs/web_deployment.md의 B절 확인 목록을 모두 끝내세요.
# - 영속 디스크는 유료 인스턴스에서만 붙일 수 있고, 디스크가 있는 서비스는 여러 인스턴스로 늘릴 수 없음 (Render 문서).
# - 디스크가 있으면 무중단 배포가 꺼져 재배포 때 몇 초 끊김.
# - plan 값은 Render의 현재 플랜 ID로 확인 필요 (2026-10 Blueprint 문서 기준 예: 0.5c-512mb).
services:
  - type: web
    name: ctrec
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ctrec.web.app:app --host 0.0.0.0 --port $PORT --workers 1 --log-level warning --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    disk:
      name: ctrec-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PYTHONPATH
        value: src
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CTREC_PASSWORD
        sync: false
      - key: CTREC_REQUIRE_HTTPS
        value: "1"
      - key: CTREC_COOKIE_SECURE
        value: "1"
      - key: CTREC_MODEL
        value: claude-sonnet-5
      - key: CTREC_FALLBACKS
        value: "0"
      - key: CTREC_WEB_METERING
        value: enforce
      - key: CTREC_WEB_PAID_ENABLED
        value: "0"   # 기본 꺼짐. 별도 승인 뒤 운영자가 대시보드에서 1로 (그래도 모든 허가 조건을 서버가 다시 확인)
      - key: CTREC_WEB_BUDGET_LEDGER
        value: /var/data/ctrec/web-ledger.db
      - key: CTREC_MAX_WORKERS
        value: "4"
