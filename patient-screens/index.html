<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임상시험 찾기 문답</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B60}a:hover{color:#0A5048}
</style>
<style>body{background:#E9EBE6;display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 100%; max-width: 390px; min-height: 100vh; box-sizing: border-box; background: #F5F6F2; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #18211E; display: flex; flex-direction: column">

<header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px; background: #F5F6F2">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="뒤로 가기" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: flex-start; color: #18211E">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<p style="margin: 0; font-size: 15px; font-weight: 500">나에게 맞는 임상시험 찾기</p>
<a href="#" style="font-size: 14px; color: #55605B; text-decoration: none; min-width: 44px; text-align: right">나중에</a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #55605B">
<span>질문 3 / 6</span><span>약 2분 남음</span>
</div>
<div style="height: 6px; background: #E2E5DF; border-radius: 3px; overflow: hidden">
<div style="width: 50%; height: 6px; background: #0E6B60; border-radius: 3px"></div>
</div>
</div>
</header>

<main style="flex: 1; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="font-size: 13px; padding: 6px 12px; background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 999px; color: #3A4440">만 58세</span>
<span style="font-size: 13px; padding: 6px 12px; background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 999px; color: #3A4440">서울 거주</span>
<span style="font-size: 13px; padding: 6px 12px; background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 999px; color: #3A4440">비소세포폐암</span>
<a href="#" style="font-size: 13px; padding: 6px 4px; color: #0E6B60">수정</a>
</div>

<div style="display: flex; gap: 10px; align-items: flex-start">
<div aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #0E6B60; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"></path><rect x="5" y="6" width="14" height="12" rx="4"></rect><path d="M9 12h.01"></path><path d="M15 12h.01"></path><path d="M9 21h6"></path></svg>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 4px 18px 18px 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 18px; line-height: 1.5; font-weight: 700">유전자 검사 결과를 들으신 적 있나요?</p>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #3A4440">폐암 임상시험 중에는 EGFR, ALK 같은 유전자 변이가 있는 분만 참여할 수 있는 연구가 많아요.</p>
<details style="font-size: 14px; color: #0E6B60">
<summary style="cursor: pointer; min-height: 32px; display: flex; align-items: center">유전자 검사가 뭔가요?</summary>
<p style="margin: 6px 0 0; color: #3A4440; line-height: 1.6">조직검사 때 떼어낸 암세포로 어떤 유전자가 바뀌었는지 보는 검사예요. 결과지에는 'EGFR 양성' 같은 말이 적혀 있어요.</p>
</details>
</div>
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">유전자 검사 결과</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; background: #E4F1EE; border: 2px solid #0E6B60; border-radius: 14px; font-size: 16px; font-weight: 500">
<input type="radio" name="gene" checked="checked" style="width: 20px; height: 20px; accent-color: #0E6B60; margin: 0">네, 결과를 알아요
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 14px; font-size: 16px">
<input type="radio" name="gene" style="width: 20px; height: 20px; accent-color: #0E6B60; margin: 0">검사는 했는데 결과를 몰라요
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 14px; font-size: 16px">
<input type="radio" name="gene" style="width: 20px; height: 20px; accent-color: #0E6B60; margin: 0">검사를 받은 적 없어요
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E2E5DF; border-radius: 14px; font-size: 16px">
<input type="radio" name="gene" style="width: 20px; height: 20px; accent-color: #0E6B60; margin: 0">잘 모르겠어요
</label>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="gene-detail" style="font-size: 14px; font-weight: 500">어떤 결과였나요? (말씀하신 그대로 적어주세요)</label>
<input id="gene-detail" type="text" value="EGFR 19번 엑손 결손이라고 들었어요" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9CEC6; border-radius: 12px; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #18211E">
</div>

</main>

<footer style="padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: #F5F6F2">
<p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #55605B">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span>이름·연락처 없이 진행돼요. 모르는 항목은 건너뛰어도 나중에 서류로 확인할 수 있어요.</span>
</p>
<button style="height: 56px; border: 0; border-radius: 14px; background: #0E6B60; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">다음</button>
</footer>

</div>
</body>
</html>
