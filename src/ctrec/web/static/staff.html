<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Trialog · 연구 담당자</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<!-- 추가 정보 확인 흐름의 연구 담당자 화면. 데이터: /api/followup/staff/* (docs/dev/followup_api_contract.md). CSP: 같은 서버 파일만 -->
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/cohort.css">
<link rel="stylesheet" href="/static/staff.css">
<script src="/static/staff.js" defer></script>
</head>
<body>
<a class="skip" href="#staff-main">본문으로 건너뛰기</a>
<div class="app wide">
<header class="top">
  <div class="bar">
    <h1 class="brand"><img class="logo" src="/static/logo.svg" alt="" width="28" height="28"><span class="word">Trialog</span><span class="tag">연구 담당자 · 추가 정보 확인</span></h1>
    <span class="badge" id="conn" role="status" aria-live="polite">연결 안 됨</span>
  </div>
  <div class="meta"><a class="badge" href="/">환자 화면</a> <a class="badge" href="/cohort">코호트 현황판</a></div>
</header>

<main id="staff-main" class="stack">
  <div class="note warn" role="note"><b>연구 담당자 전용 화면입니다.</b> 판정·재평가는 서버 규칙이 정하며, 이 화면은 결과를 그대로 보여 줍니다.
    환자 답변은 환자만 입력할 수 있습니다. 서류 확인 완료·의료진 판단 완료를 입력하는 기능은 아직 없습니다.</div>

  <section class="panel" id="login" aria-labelledby="login-h">
    <h2 id="login-h">담당자 키</h2>
    <form class="body row" id="login-form">
      <label class="field">담당자 키 <input id="staff-key" type="password" autocomplete="off" required></label>
      <label class="field">기록용 이름 <input id="staff-id" type="text" value="coordinator" pattern="[A-Za-z0-9._\-]{1,64}" maxlength="64"></label>
      <button class="btn sm" type="submit">연결</button>
      <button class="btn ghost sm" type="button" id="logout" hidden>연결 해제</button>
    </form>
    <p class="hint body" id="login-hint">서버 설정 CTREC_STAFF_KEY와 같은 키입니다. 이 탭에만 기억합니다(탭을 닫으면 지워짐).</p>
  </section>

  <div class="staff-grid" id="workspace" hidden>
    <section class="panel" aria-labelledby="list-h">
      <h2 id="list-h"><span>사례·대기열</span> <button class="btn ghost sm" id="reload" type="button">새로고침</button></h2>
      <div class="tabs body" role="tablist">
        <button id="tab-cases" role="tab" aria-selected="true" aria-controls="cases" type="button">사례</button>
        <button id="tab-queue" role="tab" aria-selected="false" aria-controls="queue" type="button">확인 대기열</button>
      </div>
      <div class="body" id="cases" role="tabpanel" aria-labelledby="tab-cases"></div>
      <div class="body" id="queue" role="tabpanel" aria-labelledby="tab-queue" hidden></div>
    </section>
    <section class="panel" aria-labelledby="case-h">
      <h2 id="case-h" tabindex="-1">사례를 고르세요</h2>
      <div class="body stack" id="case"><div class="empty">왼쪽에서 사례를 고르면 판정·제안·요청 이력이 보입니다.</div></div>
    </section>
  </div>
</main>
</div>
</body>
</html>
