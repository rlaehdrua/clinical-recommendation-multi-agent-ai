<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임상시험 추천 에이전트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --line: #e3e6eb; --text: #1b1f24; --muted: #6a7280;
  --accent: #2f6fed; --accent-soft: #e7eefd; --ok: #1f9d55; --ok-soft: #e4f5ec; --warn: #b7791f; --warn-soft: #fbf1df;
  --bad: #d64545; --bad-soft: #fbe6e6; --idle: #c9ced6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --panel-2: #1e232b; --line: #2a3039; --text: #e6e9ee; --muted: #98a1ae;
    --accent: #6d9bff; --accent-soft: #1d2a45; --ok: #4cc38a; --ok-soft: #173327; --warn: #e0a84a; --warn-soft: #3a2d15;
    --bad: #f07272; --bad-soft: #3d1c1c; --idle: #3a414c; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.accent { background: var(--accent-soft); color: var(--accent); }
.disclaimer { font-size: 12px; color: var(--muted); padding: 8px 20px; background: var(--warn-soft); border-bottom: 1px solid var(--line); }
main { display: grid; grid-template-columns: 340px minmax(0,1fr) 400px; gap: 16px; padding: 16px 20px 40px; align-items: start; }
@media (max-width: 1280px) { main { grid-template-columns: 320px minmax(0,1fr); } #right { grid-column: 1 / -1; } }
@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.panel > h2 { font-size: 13px; font-weight: 700; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.body { padding: 12px 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
#qslot:empty { display: none; }
label.field { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
select, textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { resize: vertical; min-height: 90px; }
.preview { font-size: 13px; background: var(--panel-2); border-radius: 8px; padding: 10px; max-height: 170px; overflow: auto; white-space: pre-wrap; }
.seg { display: flex; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.trial-list { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.trial-opt { display: flex; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; cursor: pointer; align-items: flex-start; }
.trial-opt:last-child { border-bottom: 0; } .trial-opt input { margin-top: 3px; }
.trial-list.off { opacity: .45; pointer-events: none; }
.cand-mode { display: flex; gap: 14px; margin-bottom: 6px; font-size: 12.5px; } .cand-mode label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.trial-opt .tid { font-weight: 600; font-variant-numeric: tabular-nums; }
.trial-opt .ttl { color: var(--muted); display: block; }
.btn { width: 100%; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: .5; cursor: progress; } .btn.ghost { background: var(--panel-2); color: var(--text); }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
.hint { font-size: 12px; color: var(--muted); }

/* 에이전트 구성도 */
#graph { width: 100%; height: auto; display: block; }
.node rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; transition: all .25s; }
.node text { fill: var(--muted); font-size: 12.5px; font-weight: 600; text-anchor: middle; transition: fill .25s; }
.node text.sub { font-size: 10.5px; font-weight: 400; }
.node.done rect { fill: var(--ok-soft); stroke: var(--ok); } .node.done text { fill: var(--ok); }
.node.active rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
.node.active text { fill: var(--accent); }
.node.active rect { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.edge { stroke: var(--idle); stroke-width: 1.5; fill: none; transition: stroke .25s; }
.edge.on { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 5; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .node.active rect, .edge.on { animation: none; } }

.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.step { font-size: 11.5px; text-align: center; padding: 6px 4px; border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.step b { display: block; font-size: 12px; }
.step.active { background: var(--accent-soft); color: var(--accent); } .step.done { background: var(--ok-soft); color: var(--ok); }
@media (max-width: 820px) { .steps { grid-template-columns: repeat(3, 1fr); } }

#feed { max-height: 520px; overflow: auto; }
.ev { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.ev .who { font-weight: 700; margin-right: 6px; }
.ev.plan .msg { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; }
.ev .chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); margin-left: 4px; }
.empty { color: var(--muted); padding: 24px 14px; text-align: center; font-size: 13px; }

/* 판정 카드 */
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.card + .card { margin-top: 8px; }
.card .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .tid { font-weight: 700; } .card .ttl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card .sum { font-size: 12.5px; margin-top: 6px; }
.hist { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.qbox { border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px; }
.qbox h3 { margin: 0 0 8px; font-size: 14px; }
.q + .q { margin-top: 10px; } .q p { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; } .q .why { font-size: 12px; color: var(--muted); font-weight: 400; }
.rec { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.rec + .rec { margin-top: 8px; }
.rec .rank { font-size: 20px; font-weight: 800; color: var(--accent); margin-right: 6px; }
.rec ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.phys { margin-top: 8px; background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.phys b { color: var(--warn); }
.callout { background: var(--bad-soft); color: var(--text); border-left: 4px solid var(--bad); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
details.report summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.md { font-size: 13px; overflow-wrap: anywhere; } .md h1 { font-size: 17px; } .md h2 { font-size: 15px; margin-top: 18px; } .md h3 { font-size: 14px; }
.md table { border-collapse: collapse; width: 100%; font-size: 12px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.md blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--warn); background: var(--warn-soft); }
.usage { font-size: 12px; color: var(--muted); }

/* 페이지 전환 */
#pages { margin-left: auto; width: 260px; }
#page-result { display: block; max-width: 960px; margin: 0 auto; }
#page-result .rec { padding: 16px; }
@media (max-width: 820px) { #pages { width: auto; } }
</style>
</head>
<body>
<header>
  <h1>인터랙티브 임상시험 추천 · 멀티 에이전트</h1>
  <span class="badge accent" id="model">모델 -</span>
  <span class="badge" id="run-state">대기 중</span>
  <span class="badge" id="elapsed" hidden>0s</span>
  <button class="badge" id="cancel" hidden style="cursor:pointer">실행 취소</button>
  <nav class="seg" id="pages">
    <button class="on" data-page="run">① 진행</button>
    <button data-page="result" disabled>② 최종 추천</button>
  </nav>
</header>
<div class="disclaimer" id="disclaimer"></div>

<main id="page-run">
  <!-- 입력 -->
  <section class="panel" id="left">
    <h2>입력</h2>
    <div class="body stack">
      <div>
        <label class="field" for="patient">환자</label>
        <select id="patient"></select>
      </div>
      <div id="preview-wrap">
        <div class="preview" id="preview"></div>
        <button class="link" id="to-custom">직접 입력하기</button>
      </div>
      <div id="custom-wrap" hidden>
        <label class="field" for="custom">환자 정보 직접 입력 (인구학·병력·검사·투약)</label>
        <textarea id="custom" placeholder="예) 58세 남성, 방광암 cT2N0M0, 시스플라틴 기반 항암 2주기 후 반응 없음, ECOG 1 ..."></textarea>
        <button class="link" id="to-list">목록에서 선택하기</button>
      </div>
      <div>
        <label class="field">후보 임상시험 <span id="trial-count"></span></label>
        <div class="cand-mode">
          <label><input type="radio" name="cand-mode" value="screen" checked> 전체 시험에서 자동 추림</label>
          <label><input type="radio" name="cand-mode" value="given"> 직접 선택</label>
        </div>
        <div class="trial-list" id="trials"></div>
        <div class="hint" style="margin-top:4px" id="cand-hint"></div>
      </div>
      <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="search"> 후보가 모두 부적격·모집 종료일 때 ClinicalTrials.gov 추가 검색 허용</label>
      <button class="btn" id="start">실행</button>
      <div class="hint" id="start-hint"></div>
    </div>
  </section>

  <!-- 에이전트 협업 -->
  <section class="stack" id="center">
    <div class="panel">
      <h2>에이전트 구성도 <span class="hint">실행 중인 에이전트가 파란색, 완료된 에이전트가 초록색으로 표시됩니다</span></h2>
      <div class="body">
        <svg id="graph" viewBox="0 0 720 330" role="img" aria-label="멀티 에이전트 구성도"></svg>
        <div class="steps" id="steps"></div>
      </div>
    </div>
    <div class="panel">
      <h2>진행 로그 <span class="hint" id="feed-count"></span></h2>
      <div id="feed"><div class="empty">환자와 시험을 고른 뒤 실행하면 에이전트들의 계획·도구 호출·판정 과정이 여기에 실시간으로 표시됩니다.</div></div>
    </div>
  </section>

  <!-- 판정·결과 -->
  <section class="stack" id="right">
    <div id="qslot"></div>
    <div class="panel">
      <h2>시험별 판정</h2>
      <div class="body" id="cards"><div class="empty">아직 평가된 시험이 없습니다.</div></div>
    </div>
  </section>
</main>

<!-- 2페이지: 최종 추천 -->
<main id="page-result" hidden>
  <div class="panel">
    <h2>최종 추천 <span class="usage" id="usage"></span></h2>
    <div class="body" id="final"><div class="empty">추천 에이전트가 완료되면 결과가 표시됩니다.</div></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { patients: [], trials: [], custom: false, runId: null, es: null, t0: 0, timer: null, cards: {}, feedN: 0 };

// ------------------------------------------------------------ 구성도
const NODES = {
  input:              { x: 70,  y: 40,  w: 110, label: "입력", sub: "환자 · 임상시험" },
  orchestrator:       { x: 360, y: 40,  w: 200, label: "오케스트레이터", sub: "계획 수립 · 도구 호출" },
  patient_profiler:   { x: 180, y: 150, w: 140, label: "환자 정보 이해", sub: "프로파일 구조화" },
  criteria_parser:    { x: 360, y: 150, w: 140, label: "기준 파싱", sub: "기준 → 원자 규칙" },
  matcher:            { x: 540, y: 150, w: 140, label: "추론·매칭", sub: "규칙별 판정 + 근거" },
  rule_engine:        { x: 640, y: 230, w: 130, label: "규칙 엔진", sub: "나이·수치 결정론 판정" },
  answerer:           { x: 60,  y: 295, w: 100, label: "환자", sub: "답변" },
  question_generator: { x: 210, y: 295, w: 140, label: "질문 생성", sub: "부족 정보 확인" },
  recommender:        { x: 400, y: 295, w: 140, label: "추천", sub: "우선순위 결정" },
  explainer:          { x: 580, y: 295, w: 130, label: "결과 설명", sub: "근거 보고서" },
};
const EDGES = [
  ["input","orchestrator"], ["orchestrator","patient_profiler"], ["orchestrator","criteria_parser"], ["orchestrator","matcher"],
  ["criteria_parser","matcher"], ["patient_profiler","matcher"], ["rule_engine","matcher"],
  ["orchestrator","question_generator"], ["question_generator","answerer"], ["answerer","patient_profiler"],
  ["orchestrator","recommender"], ["recommender","explainer"],
];
function drawGraph() {
  const g = $("#graph"); const H = 34;
  let html = "";
  for (const [a,b] of EDGES) {
    const A = NODES[a], B = NODES[b];
    // 같은 줄에서 다른 노드를 건너뛰는 연결은 아래로 돌아가는 곡선으로 그림
    const d = Math.abs(A.y - B.y) < 5 && Math.abs(A.x - B.x) > 220
      ? `M${A.x},${A.y+22} C${A.x},${A.y+75} ${B.x},${B.y+75} ${B.x},${B.y+22}`
      : `M${A.x},${A.y} C${A.x},${(A.y+B.y)/2} ${B.x},${(A.y+B.y)/2} ${B.x},${B.y}`;
    html += `<path class="edge" id="e-${a}-${b}" d="${d}"/>`;
  }
  for (const [k,n] of Object.entries(NODES)) {
    html += `<g class="node" id="n-${k}"><rect x="${n.x-n.w/2}" y="${n.y-H/2-4}" width="${n.w}" height="${H+10}" rx="10"/>
      <text x="${n.x}" y="${n.y+1}">${esc(n.label)}</text><text class="sub" x="${n.x}" y="${n.y+15}">${esc(n.sub)}</text></g>`;
  }
  g.innerHTML = html;
}
function nodeState(k, s) { const el = document.getElementById("n-"+k); if (!el) return; el.classList.remove("active","done"); if (s) el.classList.add(s); }
function edgeOn(a, b, on=true) { const el = document.getElementById(`e-${a}-${b}`); if (el) el.classList.toggle("on", on); }
function clearEdges() { document.querySelectorAll(".edge.on").forEach(e => e.classList.remove("on")); }

const STEPS = ["① 기준 입력","② 환자 정보","③ 추출·매칭","④ 부족 정보 탐지","⑤ 질문·재평가","⑥ 추천"];
function drawSteps() { $("#steps").innerHTML = STEPS.map((s,i) => `<div class="step" id="s${i}"><b>${s.slice(0,1)}</b>${esc(s.slice(2))}</div>`).join(""); }
function step(i, s) { const el = $("#s"+i); if (!el) return; if (s === "done") { el.classList.remove("active"); el.classList.add("done"); } else if (!el.classList.contains("done")) el.classList.add("active"); }

// ------------------------------------------------------------ 입력 패널
async function init() {
  drawGraph(); drawSteps();
  const cfg = await (await fetch("/api/config")).json();
  $("#model").textContent = "모델 " + cfg.model; $("#disclaimer").textContent = cfg.disclaimer;
  state.patients = await (await fetch("/api/patients")).json();
  state.trials = await (await fetch("/api/trials")).json();
  const groups = {};
  for (const p of state.patients) (groups[p.group] ||= []).push(p);
  $("#patient").innerHTML = Object.entries(groups).map(([g, ps]) =>
    `<optgroup label="${esc(g)}">${ps.map(p => `<option value="${esc(p.patient_id)}">${esc(p.patient_id)} · ${esc(p.text.slice(0, 48))}…</option>`).join("")}</optgroup>`).join("");
  $("#trials").innerHTML = state.trials.map(t => `<label class="trial-opt"><input type="checkbox" value="${esc(t.trial_id)}">
    <span><span class="tid">${esc(t.trial_id)}</span> ${statusBadge(t.overall_status)}${t.synthetic ? ' <span class="badge">가상</span>' : ""}
    <span class="ttl">${esc(t.title)}</span></span></label>`).join("");
  $("#trials").addEventListener("change", countTrials);
  $("#patient").addEventListener("change", onPatient);
  document.querySelectorAll('input[name="cand-mode"]').forEach(r => r.onchange = countTrials);
  $("#to-custom").onclick = () => setCustom(true); $("#to-list").onclick = () => setCustom(false);
  $("#start").onclick = start;
  $("#cancel").onclick = cancelRun;
  document.querySelectorAll("#pages button").forEach(b => b.onclick = () => showPage(b.dataset.page));
  const first = state.patients.find(p => p.group === "사업단 제공") || state.patients[0];
  if (first) { $("#patient").value = first.patient_id; onPatient(); }
  resume();
}
function statusBadge(s) {
  const map = { RECRUITING: ["모집 중","ok"], NOT_YET_RECRUITING: ["모집 예정","ok"], COMPLETED: ["완료","bad"], TERMINATED: ["조기 종료","bad"],
    WITHDRAWN: ["철회","bad"], ACTIVE_NOT_RECRUITING: ["모집 종료","bad"], SUSPENDED: ["중단","bad"], UNKNOWN: ["상태 미확인","warn"] };
  const [t, c] = map[s] || [s || "-", ""]; return `<span class="badge ${c}">${esc(t)}</span>`;
}
// 외부 표현(아키텍처 §49): 등록 확정처럼 보이지 않는 표현. 진행 중 카드는 내부 판정을, 최종 결과는 match_status를 받음
function eligBadge(e) {
  const m = { ELIGIBLE: ["공개 기준 충족","ok"], INELIGIBLE: ["공개 기준 불충족","bad"], UNCERTAIN: ["확인 필요","warn"], NOT_EVALUATED: ["평가 실패","warn"],
    CRITERIA_MATCH: ["공개 기준 충족","ok"], POTENTIAL_MATCH: ["기록 확인 시 충족 가능","warn"], NEEDS_REVIEW: ["의료진 검토 필요","warn"],
    INSUFFICIENT_INFORMATION: ["추가 정보 필요","warn"], CRITERIA_MISMATCH: ["공개 기준 불충족","bad"] };
  const [t, c] = m[e] || ["평가 중","accent"]; return `<span class="badge ${c}">${t}</span>`;
}
function onPatient() {
  const p = state.patients.find(x => x.patient_id === $("#patient").value); if (!p) return;
  $("#preview").textContent = p.text;
  document.querySelectorAll("#trials input").forEach(i => i.checked = p.candidate_trials.includes(i.value));
  // 선택된 후보 시험을 목록 맨 위로
  const list = $("#trials"); [...list.children].sort((x, y) => y.querySelector("input").checked - x.querySelector("input").checked).forEach(el => list.appendChild(el));
  list.scrollTop = 0;
  countTrials();
}
function setCustom(on) { state.custom = on; $("#custom-wrap").hidden = !on; $("#preview-wrap").hidden = on; $("#patient").disabled = on;
  if (!on) onPatient(); }
function selectedTrials() { return [...document.querySelectorAll("#trials input:checked")].map(i => i.value); }
function screenMode() { return document.querySelector('input[name="cand-mode"]:checked').value === "screen"; }
function countTrials() {
  const on = screenMode();
  $("#trials").classList.toggle("off", on);
  $("#trial-count").textContent = on ? `(전체 ${state.trials.length}개에서 자동 추림)` : `(${selectedTrials().length}개 선택)`;
  $("#cand-hint").innerHTML = on
    ? "후보 추림 에이전트가 전체 시험을 훑어 이 환자에게 해당될 만한 시험(최대 5개)을 고르고, 그 시험들만 자세히 평가해 가장 적합한 1개를 추천합니다."
    : `평가할 시험을 직접 고릅니다. 환자 질환별로 미리 정해 둔 후보가 자동 선택됩니다. <button class="link" id="clear-trials">선택 해제</button>`;
  const clear = $("#clear-trials");
  if (clear) clear.onclick = () => { document.querySelectorAll("#trials input").forEach(i => i.checked = false); countTrials(); };
}

// ------------------------------------------------------------ 실행
// 실행 ID만 탭 단위(sessionStorage)로 기억해 새로고침 후 이어 봄. 접근 권한은 서버가 HttpOnly 쿠키로 확인
const RUN_KEY = "ctrec-run-id";
function remember(id) { try { id ? sessionStorage.setItem(RUN_KEY, id) : sessionStorage.removeItem(RUN_KEY); } catch (e) {} }
function remembered() { try { return sessionStorage.getItem(RUN_KEY); } catch (e) { return null; } }
function post(url, body) {
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-CTREC-Request": "1" }, body: JSON.stringify(body || {}) });
}
async function detailOf(r) { let d = null; try { d = (await r.json()).detail; } catch (e) {} return typeof d === "string" ? d : `요청 실패 (${r.status})`; }
function connect(runId) {
  if (state.es) state.es.close();
  state.runId = runId; remember(runId);
  setRunState("실행 중", "accent"); $("#cancel").hidden = false; $("#cancel").disabled = false; $("#start").disabled = true;
  state.t0 = Date.now(); $("#elapsed").hidden = false; clearInterval(state.timer);
  state.timer = setInterval(() => $("#elapsed").textContent = Math.round((Date.now() - state.t0) / 1000) + "s", 500);
  state.es = new EventSource(`/api/runs/${runId}/events`);
  state.es.onmessage = (m) => handle(JSON.parse(m.data));
  // 실행 기록이 없어졌거나(보관 기간 경과·서버 재시작) 권한이 없어 재연결도 안 되면 '실행 중'에 멈추지 않게 표시
  state.es.onerror = () => { if (state.es && state.es.readyState === EventSource.CLOSED) { setRunState("연결 끊김", "bad"); finish(); } };
}
async function cancelRun() {
  if (!state.runId) return;
  $("#cancel").disabled = true;
  const r = await post(`/api/runs/${state.runId}/cancel`);
  if (r.ok) setRunState("취소 중", "warn");
  else { $("#cancel").disabled = false; feed(null, "pipeline", `<span style="color:var(--bad)">취소 실패: ${esc(await detailOf(r))}</span>`); }
}
async function resume() {
  const id = remembered(); if (!id) return;
  const r = await fetch(`/api/runs/${id}`);
  if (!r.ok) { remember(null); return hint("이전 실행에 접근할 수 없습니다(종료 후 보관 기간 경과 또는 권한 없음)."); }
  resetView(); connect(id);
}
async function start() {
  const body = { trial_ids: screenMode() ? [] : selectedTrials(), screen: screenMode(), allow_search: $("#search").checked };
  if (state.custom) { body.custom_text = $("#custom").value.trim(); if (!body.custom_text) return hint("환자 정보를 입력하세요."); }
  else body.patient_id = $("#patient").value;
  if (!body.screen && !body.trial_ids.length && !body.allow_search) return hint("후보 임상시험을 하나 이상 선택하세요.");
  if (state.es) { state.es.close(); state.es = null; }  // 이전 실행의 연결·상태 정리
  resetView();
  $("#start").disabled = true; hint("");
  const r = await post("/api/runs", body);
  if (!r.ok) { $("#start").disabled = false; return hint(await detailOf(r)); }
  connect((await r.json()).run_id);
}
function showPage(name) {
  $("#page-run").hidden = name !== "run"; $("#page-result").hidden = name !== "result";
  document.querySelectorAll("#pages button").forEach(b => b.classList.toggle("on", b.dataset.page === name));
  window.scrollTo({ top: 0 });
}
function hint(t) { $("#start-hint").textContent = t; }
function setRunState(t, c) { const el = $("#run-state"); el.textContent = t; el.className = "badge " + (c || ""); }
function resetView() {
  drawGraph(); drawSteps(); state.cards = {}; state.feedN = 0;
  showPage("run"); $('#pages [data-page="result"]').disabled = true;
  $("#feed").innerHTML = ""; $("#cards").innerHTML = '<div class="empty">아직 평가된 시험이 없습니다.</div>';
  $("#final").innerHTML = '<div class="empty">추천 에이전트가 완료되면 결과가 표시됩니다.</div>'; $("#qslot").innerHTML = ""; $("#usage").textContent = "";
}
function finish() {
  $("#cancel").hidden = true;
  state.es && state.es.close(); clearInterval(state.timer); $("#start").disabled = false; clearEdges();
  document.querySelectorAll(".node.active").forEach(n => n.classList.remove("active"));
}

// ------------------------------------------------------------ 이벤트 처리
const WHO = { pipeline: "파이프라인", orchestrator: "오케스트레이터", screener: "후보 추림", patient_profiler: "환자 정보 이해", criteria_parser: "기준 파싱",
  matcher: "추론·매칭", question_generator: "질문 생성", answerer: "환자 답변", recommender: "추천", explainer: "결과 설명" };
const TOOL_TARGET = { profile_patient: ["patient_profiler"], evaluate_trials: ["criteria_parser","matcher"], ask_clarifying_questions: ["question_generator"],
  finalize_recommendation: ["recommender"], search_trials: ["input"], list_candidate_trials: [], screen_trials: [] };
const TOOL_KO = { screen_trials: "후보 시험 추림", profile_patient: "환자 프로파일 구조화", list_candidate_trials: "후보 시험 확인", search_trials: "CT.gov 검색", evaluate_trials: "시험 적격성 평가",
  ask_clarifying_questions: "확인 질문 라운드", finalize_recommendation: "최종 추천 생성" };

function handle(ev) {
  if (ev.type === "status" && ev.cancelling) { setRunState("취소 중", "warn"); $("#qslot").innerHTML = ""; }
  if (ev.type === "status") { if (ev.patient_id) feed(0, "pipeline", `환자 <b>${esc(ev.patient_id)}</b> · 시험 ${ev.trial_ids.length}개`); else feed(null, "pipeline", esc(ev.message)); return; }
  if (ev.type === "trace") return onTrace(ev.record);
  if (ev.type === "questions") return showQuestions(ev.questions);
  if (ev.type === "answers") { $("#qslot").innerHTML = ""; return; }
  if (ev.type === "result") return showResult(ev);
  if (ev.type === "error") { feed(null, "pipeline", `<span style="color:var(--bad)">오류: ${esc(ev.message)}</span>`); setRunState("오류", "bad"); return; }
  if (ev.type === "end") {
    const END = { completed: ["완료", "ok"], cancelled: ["취소됨", "warn"], timed_out: ["시간 초과", "bad"], error: ["오류", "bad"] };
    const [t, c] = END[ev.state] || ["완료", "ok"]; setRunState(t, c);
    if (ev.state !== "completed") $("#qslot").innerHTML = "";
    finish();
  }
}

function onTrace(r) {
  const a = r.agent, e = r.event;
  if (a === "orchestrator") {
    nodeState("orchestrator", "active"); nodeState("input", "done"); edgeOn("input","orchestrator");
    if (e === "plan") return feed(r.t, a, esc(r.message), "plan");
    if (e === "tool_call") {
      clearEdges(); edgeOn("input","orchestrator", false);
      (TOOL_TARGET[r.tool] || []).forEach(t => edgeOn("orchestrator", t));
      return feed(r.t, a, `도구 호출 <span class="chip">${esc(TOOL_KO[r.tool] || r.tool)}</span>${r.input && Object.keys(r.input).length ? ` <span class="chip">${esc(JSON.stringify(r.input))}</span>` : ""}`);
    }
    if (e === "search") return feed(r.t, a, esc(r.message));
    if (e === "tool_error") return feed(r.t, a, `<span style="color:var(--bad)">도구 오류: ${esc(r.message)}</span>`);
    if (e === "fallback_finalize") return feed(r.t, a, esc(r.message));
    return;
  }
  if (a === "pipeline") {
    if (e === "start") { nodeState("input","done"); step(0); }
    if (e === "error") feed(r.t, a, `<span style="color:var(--bad)">${esc(r.message)}</span>`);
    return;
  }
  if (a === "criteria_parser") {
    step(0, e === "done" ? "done" : undefined); nodeState(a, e === "start" ? "active" : "done");
    if (e === "start") { edgeOn("criteria_parser","matcher"); upsertCard(r.trial_id, { parsing: true }); feed(r.t, a, `${esc(r.trial_id)} 기준을 원자 규칙으로 변환 중`); }
    else { upsertCard(r.trial_id, { parsing: false, n_rules: r.n_rules }); feed(r.t, a, `${esc(r.trial_id)} → 규칙 ${r.n_rules}개`); }
    return;
  }
  if (a === "patient_profiler") {
    step(1, e === "done" ? "done" : undefined); nodeState(a, e === "start" ? "active" : "done"); edgeOn("patient_profiler","matcher", e === "done");
    if (e === "start") feed(r.t, a, "환자 프로파일에서 핵심 정보 추출 중");
    else feed(r.t, a, `추출 완료${r.missing && r.missing.length ? ` · 누락/모호: ${esc(r.missing.slice(0, 4).join(", "))}${r.missing.length > 4 ? " 외" : ""}` : ""}`);
    return;
  }
  if (a === "matcher") {
    step(2); nodeState(a, e === "start" ? "active" : "done"); nodeState("rule_engine", e === "start" ? "active" : "done"); edgeOn("rule_engine","matcher", e === "start");
    if (e === "start") { upsertCard(r.trial_id, { matching: true }); feed(r.t, a, `${esc(r.trial_id)} 규칙별 판정 중 (규칙 엔진 → LLM 추론)`); }
    else {
      const elig = (r.message || "").split(":")[0];
      upsertCard(r.trial_id, { matching: false, eligibility: elig, summary: r.message });
      feed(r.t, a, `${esc(r.trial_id)} ${eligBadge(elig)} <span class="hint">${esc((r.message || "").slice(elig.length + 1))}</span>`);
      step(2, "done"); step(3); if (elig !== "UNCERTAIN") { /* 부족 정보 없는 시험 */ }
    }
    return;
  }
  if (a === "question_generator") {
    step(3, "done"); step(4); nodeState(a, "done"); edgeOn("question_generator","answerer");
    const qs = r.questions || [];
    feed(r.t, a, `라운드 ${r.round} · 질문 ${qs.length}개` + qs.map(q => `<div style="margin-top:4px">• ${esc(q.question)} <span class="chip">${q.purpose === "physician_reference" ? "의사 참고용" : "판정용"}</span></div>`).join(""));
    nodeState("answerer", "active");
    return;
  }
  if (a === "answerer") {
    nodeState("answerer", "done"); edgeOn("question_generator","answerer", false); edgeOn("answerer","patient_profiler");
    feed(r.t, a, (r.qa || []).map(q => `<div>Q. ${esc(q.question)}<br><b>A. ${esc(q.answer)}</b></div>`).join(""));
    return;
  }
  if (a === "recommender") {
    step(3, "done"); step(4, "done"); step(5); nodeState(a, e === "start" ? "active" : "done"); edgeOn("recommender","explainer", e === "done");
    feed(r.t, a, e === "start" ? `시험 ${r.n_trials}개 종합 · 우선순위 결정 중` : `추천 순서: ${esc(r.message)}`);
    return;
  }
  if (a === "screener") {
    feed(r.t, a, e === "start" ? `전체 ${r.pool}개 시험에서 후보 추림 중` : `${esc(r.message)}${r.selected ? ` <span class="chip">${esc(r.selected.join(", "))}</span>` : ""}`);
    return;
  }
  if (a === "explainer") {
    nodeState(a, e === "start" ? "active" : "done");
    if (e === "done") { step(5, "done"); nodeState("orchestrator", "done"); clearEdges(); }
    feed(r.t, a, e === "start" ? "근거 보고서 작성 중" : "보고서 작성 완료");
  }
}

function feed(t, who, html, cls = "") {
  const f = $("#feed"); if (state.feedN === 0) f.innerHTML = "";
  state.feedN++; $("#feed-count").textContent = `${state.feedN}개 이벤트`;
  const d = document.createElement("div"); d.className = "ev " + cls;
  d.innerHTML = `<div class="t">${t == null ? "" : Number(t).toFixed(1) + "s"}</div><div><span class="who">${esc(WHO[who] || who)}</span>${cls === "plan" ? `<div class="msg">${html}</div>` : html}</div>`;
  f.appendChild(d); f.scrollTop = f.scrollHeight;
}

function upsertCard(tid, patch) {
  const c = (state.cards[tid] ||= { history: [] });
  if (patch.eligibility && c.eligibility !== patch.eligibility) c.history.push(patch.eligibility);
  Object.assign(c, patch);
  const t = state.trials.find(x => x.trial_id === tid) || {};
  const status = c.parsing ? '<span class="badge accent">기준 파싱 중</span>' : c.matching ? '<span class="badge accent">판정 중</span>' : c.eligibility ? eligBadge(c.eligibility) : '<span class="badge">대기</span>';
  const html = `<div class="head"><span class="tid">${esc(tid)}</span>${statusBadge(t.overall_status)}${status}${c.n_rules ? `<span class="badge">규칙 ${c.n_rules}개</span>` : ""}</div>
    <div class="ttl">${esc(t.title || "")}</div>${c.summary ? `<div class="sum">${esc(c.summary.slice((c.eligibility || "").length + 1).trim())}</div>` : ""}
    ${c.history.length > 1 ? `<div class="hist">판정 변화: ${c.history.map(h => eligBadge(h)).join(" → ")}</div>` : ""}`;
  let el = document.getElementById("card-" + tid);
  if (!el) { if (!Object.keys(state.cards).length || $("#cards .empty")) $("#cards").innerHTML = "";
    el = document.createElement("div"); el.className = "card"; el.id = "card-" + tid; $("#cards").appendChild(el); }
  el.innerHTML = html;
}

function showQuestions(qs) {
  setRunState("답변 대기", "warn");
  $("#qslot").innerHTML = `<div class="qbox"><h3>확인 질문 (${qs.length}개)</h3>
    <div class="hint" style="margin-bottom:10px">판정에 부족한 정보입니다. 모르는 항목은 비워 두면 '모름'으로 처리됩니다. 이름·연락처 등 개인 식별 정보는 입력하지 마세요.</div>
    ${qs.map(q => `<div class="q"><p>${esc(q.question)} <span class="badge ${q.purpose === "physician_reference" ? "warn" : "accent"}">${q.purpose === "physician_reference" ? "의사 참고용" : "판정용"}</span></p>
      <div class="why">${esc(q.why)}</div><input type="text" data-q="${esc(q.question_id)}" placeholder="${q.answer_type === "yes_no" ? "예 / 아니요" : q.answer_type === "number" ? "숫자" : q.answer_type === "date" ? "YYYY-MM-DD" : "답변"}"></div>`).join("")}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="send">답변 보내기</button>
    <button class="btn ghost" id="skip" style="width:auto;white-space:nowrap;padding:10px 14px">모두 모름 · 건너뛰기</button></div></div>`;
  $("#qslot").scrollIntoView({ behavior: "smooth", block: "start" });
  const first = $("#qslot input"); first && first.focus();
  const submit = async (skip) => {
    const answers = {}; document.querySelectorAll("#qslot input").forEach(i => answers[i.dataset.q] = (!skip && i.value.trim()) || "모름");
    $("#send").disabled = $("#skip").disabled = true;
    const r = await post(`/api/runs/${state.runId}/answers`, { answers });
    if (!r.ok) { $("#send").disabled = $("#skip").disabled = false;
      return feed(null, "pipeline", `<span style="color:var(--bad)">답변 전송 실패: ${esc(await detailOf(r))}</span>`); }
    setRunState("실행 중", "accent");
  };
  $("#send").onclick = () => submit(false);
  $("#skip").onclick = () => submit(true);
}

function showResult(ev) {
  const rec = ev.result.recommendation || { ranked: [], excluded: [] };
  // 최종 판정으로 카드 갱신
  for (const [tid, m] of Object.entries(ev.result.matches || {})) upsertCard(tid, { eligibility: m.eligibility, summary: `${m.eligibility}:${m.summary.slice(m.eligibility.length + 1)}`, parsing: false, matching: false });
  const u = ev.result.usage || {};
  $("#usage").textContent = u.calls ? `호출 ${u.calls}회 · 입력 ${(u.input_tokens || 0).toLocaleString()} / 출력 ${(u.output_tokens || 0).toLocaleString()} 토큰` : "";
  let html = "";
  if (rec.no_recommendation_reason) html += `<div class="callout">${esc(rec.no_recommendation_reason)}</div>`;
  const recCard = (r, top) => `<div class="rec"${top ? ' style="border:2px solid var(--accent)"' : ""}><div class="head" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="rank">${r.rank}</span><b>${esc(r.trial_id)}</b>${eligBadge(r.match_status || r.eligibility)}${statusBadge((ev.trials[r.trial_id] || {}).overall_status)}
      ${(ev.trials[r.trial_id] || {}).url ? `<a class="link" href="${esc(ev.trials[r.trial_id].url)}" target="_blank" rel="noopener">CT.gov ↗</a>` : ""}</div>
      <div class="ttl" style="font-size:12.5px;color:var(--muted)">${esc((ev.trials[r.trial_id] || {}).title || "")}</div>
      <div style="margin-top:6px;font-size:13px">${esc(r.rationale)}</div>
      ${r.key_concerns.length ? `<ul>${r.key_concerns.map(k => `<li>${esc(k)}</li>`).join("")}</ul>` : ""}
      ${r.next_steps.length ? `<div class="hint" style="margin-top:6px">다음 단계: ${r.next_steps.map(esc).join(" · ")}</div>` : ""}
      ${r.physician_review.length ? `<div class="phys"><b>의사 확인 필요 (${r.physician_review.length})</b>${r.physician_review.map(n => `<div style="margin-top:4px">• ${esc(n)}</div>`).join("")}</div>` : ""}
      ${(r.verification_needed || []).length ? `<div class="phys"><b>문서 확인 필요 · UNVERIFIED (${r.verification_needed.length})</b>${r.verification_needed.map(n => `<div style="margin-top:4px">• ${esc(n)}</div>`).join("")}</div>` : ""}
    </div>`;
  const top = rec.recommended || [];
  if (top.length) {
    html += `<div class="hint" style="margin-bottom:6px"><b>추천 그룹</b> · ${eligBadge(top[0].match_status)} ${top.length}개</div>`;
    html += top.map(r => recCard(r, true)).join("");
    if (ev.match_note) html += `<div class="hint" style="margin-top:8px">${esc(ev.match_note)}</div>`;
    if (rec.selection_reason) html += `<div class="card" style="margin-top:8px;background:var(--accent-soft);border:0"><b style="font-size:12.5px">표시 순서</b><div class="sum">${esc(rec.selection_reason)}</div></div>`;
  }
  const others = rec.ranked.filter(r => !top.some(t => t.trial_id === r.trial_id));
  if (others.length) html += `<details style="margin-top:10px"><summary class="hint">다른 후보 ${others.length}개 (추가 확인이 필요한 시험)</summary><div style="margin-top:6px">${others.map(r => recCard(r, false)).join("")}</div></details>`;
  if (rec.excluded.length) html += `<details style="margin-top:10px"><summary class="hint">제외된 시험 ${rec.excluded.length}개</summary>${rec.excluded.map(x => `<div class="card" style="margin-top:6px"><b>${esc(x.trial_id)}</b><div class="sum">${esc(x.reason)}</div></div>`).join("")}</details>`;
  if (ev.report) {
    const md = window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(ev.report)) : `<pre style="white-space:pre-wrap">${esc(ev.report)}</pre>`;
    html += `<details class="report" style="margin-top:12px"><summary>결과 설명 보고서 (report.md)</summary><div class="md">${md}</div></details>`;
  }
  $("#final").innerHTML = html || '<div class="empty">추천 결과가 없습니다.</div>';
  setRunState("완료", "ok");
  $('#pages [data-page="result"]').disabled = false; showPage("result");
}

init();
</script>
</body>
</html>
